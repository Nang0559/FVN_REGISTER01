name: Apply help patch

on:
  push:
    branches:
      - fix/hrm-holiday-symbol-sync-consistency

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply localization additions
        shell: python
        run: |
          import json
          from pathlib import Path

          for lang in ("vi", "ja"):
              target = Path(f"FVN_REGISTER.Shared/Localization/{lang}.help.json")
              additions = json.loads(Path(f".tmp/{lang}-help-additions.json").read_text(encoding="utf-8"))
              existing = json.loads(target.read_text(encoding="utf-8-sig"))
              merged = {**additions, **existing}
              target.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Normalize HelpRegistry test regex
        shell: python
        run: |
          from pathlib import Path
          p = Path("Tests/FVN_REGISTER.Shared.Tests/HelpRegistryTests.cs")
          s = p.read_text(encoding="utf-8")
          s = s.replace('([^"" ]+)', '([^"" ]+)')
          s = s.replace('([^"" ]+)', '([^""]+)')
          p.write_text(s, encoding="utf-8")

      - name: Remove temporary patch files
        run: rm -f .tmp/help-context-fix.patch .tmp/vi-help-additions.json .tmp/ja-help-additions.json .github/workflows/apply-help-patch.yml

      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FVN_REGISTER.Shared/Localization/vi.help.json FVN_REGISTER.Shared/Localization/ja.help.json Tests/FVN_REGISTER.Shared.Tests/HelpRegistryTests.cs .tmp .github/workflows/apply-help-patch.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat(help): apply contextual help registry patch"
          git push
