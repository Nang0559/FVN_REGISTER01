name: Playwright UI Capture

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Application URL to capture (leave blank for the configured default)"
        required: false
        type: string
      max_states:
        description: "Maximum distinct UI states to capture"
        required: false
        default: "180"
        type: string
      max_click_targets:
        description: "Maximum safe UI interactions to explore"
        required: false
        default: "500"
        type: string
      route_filter:
        description: "Only capture routes matching this regex, e.g. /equipment|/admin/import (blank = whole site)"
        required: false
        default: ""
        type: string
      open_forms:
        description: "Click buttons that only OPEN forms/dialogs (Tạo, Thêm, Sửa). Use a TEST environment only."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: playwright-ui-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture authenticated UI
    runs-on: ubuntu-latest
    # Must be longer than --global-timeout below so artifacts are always uploaded.
    timeout-minutes: 100
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://dangkyphep.fcc-vn.com.vn' }}
      PLAYWRIGHT_USERNAME: ${{ secrets.PLAYWRIGHT_USERNAME }}
      PLAYWRIGHT_PASSWORD: ${{ secrets.PLAYWRIGHT_PASSWORD }}
      PLAYWRIGHT_MAX_STATES: ${{ inputs.max_states || '180' }}
      PLAYWRIGHT_MAX_CLICK_TARGETS: ${{ inputs.max_click_targets || '500' }}
      PLAYWRIGHT_MAX_DEPTH: "12"
      # Soft stop (spec ends cleanly, writes manifest). Must be < --global-timeout (90 min).
      PLAYWRIGHT_CRAWL_BUDGET_MINUTES: "85"
      PLAYWRIGHT_MAX_TARGETS_PER_PAGE: "30"
      PLAYWRIGHT_PAGE_BUDGET_SECONDS: "150"
      # User-manual capture: numbered/outlined copy of every screenshot + buttons-inventory.csv
      PLAYWRIGHT_ANNOTATE: "true"
      PLAYWRIGHT_ROW_BUTTON_SAMPLE: "1"
      PLAYWRIGHT_INCLUDE_FORM_CONTROLS: "true"
      PLAYWRIGHT_ROUTE_FILTER: ${{ inputs.route_filter }}
      PLAYWRIGHT_OPEN_FORMS: ${{ inputs.open_forms && 'true' || 'false' }}
      CI: "true"

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate credentials and URL
        shell: bash
        run: |
          if [ -z "$PLAYWRIGHT_USERNAME" ] || [ -z "$PLAYWRIGHT_PASSWORD" ]; then
            echo "::error::Configure PLAYWRIGHT_USERNAME and PLAYWRIGHT_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$PLAYWRIGHT_BASE_URL" ]; then
            echo "::error::PLAYWRIGHT_BASE_URL is empty."
            exit 1
          fi
          case "$PLAYWRIGHT_BASE_URL" in
            https://*|http://localhost*|http://127.0.0.1*) ;;
            *) echo "::error::Use HTTPS for non-local environments."; exit 1 ;;
          esac
          node -e "const u = new URL(process.env.PLAYWRIGHT_BASE_URL); if (!['http:', 'https:'].includes(u.protocol)) process.exit(1); console.log('Capture target:', u.origin)"

      - name: Install test dependencies
        working-directory: tests/playwright
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: tests/playwright
        run: npx playwright install --with-deps chromium

      # --retries=0: a failed attempt must not be silently re-run (the old run lost 30 minutes
      # on a hung login and then "passed" on retry with nothing captured).
      # --global-timeout (90 min) ends the run before the 100 minute job limit so artifacts upload.
      - name: Run authenticated recursive UI capture
        working-directory: tests/playwright
        run: |
          npx playwright test specs/authenticated-click-capture.spec.ts \
            --project=chromium --workers=1 --retries=0 --global-timeout=5400000

      - name: Verify screenshots were produced
        if: always()
        working-directory: tests/playwright
        env:
          MIN_STATE_SCREENSHOTS: "5"
        run: |
          dir=test-results/screenshots
          count=$(find "$dir" -name 'state-*.png' 2>/dev/null | wc -l)
          {
            echo "### Playwright UI capture"
            echo "- state screenshots (clicked screens): $count"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$dir/manifest.json" ]; then
            node -e "const m=JSON.parse(require('fs').readFileSync('$dir/manifest.json','utf8')); console.log(JSON.stringify(m.summary||m.diagnostics||{}))"
          fi
          if [ "$count" -lt "$MIN_STATE_SCREENSHOTS" ]; then
            echo "::error::Only $count clicked-screen screenshots were captured (expected at least $MIN_STATE_SCREENSHOTS). Check the log lines 'safe click targets' and 'Blocked unsafe'."
            exit 1
          fi

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-capture-${{ github.run_number }}
          path: |
            tests/playwright/test-results/
            tests/playwright/playwright-report/
          if-no-files-found: warn
          retention-days: 30
