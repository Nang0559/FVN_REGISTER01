name: Import FVN AI Platform Phase 1-6 (runner)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - feature/ai-platform-phase1-6-integration

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: feature/ai-platform-phase1-6-integration

      - name: Checkout source AI platform
        uses: actions/checkout@v4
        with:
          repository: Nang0559/FVN_REGISTER_AI
          ref: 95dd39b2532729d38eb0db06b82fe20bb90fcbfc
          path: /tmp/FVN_REGISTER_AI
          fetch-depth: 1

      - name: Import AI platform projects and artifacts
        run: |
          set -euo pipefail
          SRC=/tmp/FVN_REGISTER_AI
          for d in FVN_REGISTER.AI.Core FVN_REGISTER.AI.Application FVN_REGISTER.AI.Infrastructure FVN_REGISTER.AI.Api FVN_REGISTER.AI.Worker; do rm -rf "$d"; cp -a "$SRC/$d" "$d"; done
          rm -rf Tests/FVN_REGISTER.AI.Tests
          cp -a "$SRC/Tests/FVN_REGISTER.AI.Tests" Tests/FVN_REGISTER.AI.Tests
          mkdir -p SQL docs scripts .github/workflows
          rm -rf SQL/AI
          cp -a "$SRC/SQL/AI" SQL/AI
          cp "$SRC/AI_PLATFORM_PHASES_STATUS.md" AI_PLATFORM_PHASES_STATUS.md
          for f in AI_PLATFORM_ARCHITECTURE.md AI_PLATFORM_DOCUMENTATION_INDEX.md AI_PLATFORM_OPERATIONS.md; do cp "$SRC/docs/$f" "docs/$f"; done
          cp "$SRC/scripts/apply-ai-migrations.sh" scripts/apply-ai-migrations.sh
          chmod +x scripts/apply-ai-migrations.sh
          cp "$SRC/FVN_REGISTER.API/Controllers/AIHRCaseController.cs" FVN_REGISTER.API/Controllers/AIHRCaseController.cs
          cp "$SRC/FVN_REGISTER.Shared/Pages/AIHRCaseWorkspace.razor" FVN_REGISTER.Shared/Pages/AIHRCaseWorkspace.razor
          cp "$SRC/.github/workflows/ai-platform-validation.yml" .github/workflows/ai-platform-validation.yml
          cp "$SRC/.github/workflows/ai-platform-sql-validation.yml" .github/workflows/ai-platform-sql-validation.yml

      - name: Patch host integration without overwriting newer FVN_REGISTER code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def add_project_reference(path, reference):
              p=Path(path); text=p.read_text(encoding='utf-8-sig')
              if reference not in text:
                  marker='</ItemGroup>'; idx=text.find(marker)
                  if idx<0: raise SystemExit(f'Cannot find ItemGroup in {path}')
                  p.write_text(text[:idx]+f'    <ProjectReference Include="{reference}" />\n'+text[idx:],encoding='utf-8')

          add_project_reference('FVN_REGISTER.API/FVN_REGISTER.API.csproj','..\\FVN_REGISTER.AI.Application\\FVN_REGISTER.AI.Application.csproj')
          add_project_reference('FVN_REGISTER.Shared/FVN_REGISTER.Shared.csproj','..\\FVN_REGISTER.AI.Application\\FVN_REGISTER.AI.Application.csproj')

          p=Path('FVN_REGISTER.API/Program.cs'); text=p.read_text(encoding='utf-8-sig')
          if 'AddHttpClient("FvnAi"' not in text:
              anchor='builder.Services.AddAuthorization();'
              if anchor not in text: raise SystemExit('Program.cs authorization anchor not found')
              p.write_text(text.replace(anchor,anchor+'\nbuilder.Services.AddHttpClient("FvnAi", client => client.Timeout = TimeSpan.FromSeconds(90));',1),encoding='utf-8')

          p=Path('FVN_REGISTER.API/appsettings.json'); cfg=json.loads(p.read_text(encoding='utf-8-sig')); ai=cfg.setdefault('AIPlatform',{})
          ai.setdefault('BaseUrl',''); ai.setdefault('ApiKey',''); ai.setdefault('ContextSigningKey',''); ai.setdefault('TenantCode','FCCVN'); ai.setdefault('MaximumFileSizeMb',20)
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('FVN_REGISTER.sln'); text=p.read_text(encoding='utf-8-sig')
          projects=[('FVN_REGISTER.AI.Core',r'FVN_REGISTER.AI.Core\\FVN_REGISTER.AI.Core.csproj','{C2A8E8C1-CA10-4D63-9A0E-100000000001}'),('FVN_REGISTER.AI.Application',r'FVN_REGISTER.AI.Application\\FVN_REGISTER.AI.Application.csproj','{C2A8E8C1-CA10-4D63-9A0E-100000000002}'),('FVN_REGISTER.AI.Infrastructure',r'FVN_REGISTER.AI.Infrastructure\\FVN_REGISTER.AI.Infrastructure.csproj','{C2A8E8C1-CA10-4D63-9A0E-100000000003}'),('FVN_REGISTER.AI.Api',r'FVN_REGISTER.AI.Api\\FVN_REGISTER.AI.Api.csproj','{C2A8E8C1-CA10-4D63-9A0E-100000000004}'),('FVN_REGISTER.AI.Worker',r'FVN_REGISTER.AI.Worker\\FVN_REGISTER.AI.Worker.csproj','{C2A8E8C1-CA10-4D63-9A0E-100000000005}'),('FVN_REGISTER.AI.Tests',r'Tests\\FVN_REGISTER.AI.Tests\\FVN_REGISTER.AI.Tests.csproj','{B6E0C1B1-6A11-4EAA-9D18-ACF010000006}')]
          if 'FVN_REGISTER.AI.Core\\FVN_REGISTER.AI.Core.csproj' not in text:
              lines=''.join(f'Project("{{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}}") = "{n}", "{path}", "{g}"\nEndProject\n' for n,path,g in projects); text=text.replace('Global\n',lines+'Global\n',1)
          marker='\tGlobalSection(ProjectConfigurationPlatforms) = postSolution\n'; lines=''
          for _,_,g in projects:
              if g+'.Debug|Any CPU.ActiveCfg' not in text: lines+=f'\t\t{g}.Debug|Any CPU.ActiveCfg = Debug|Any CPU\n\t\t{g}.Debug|Any CPU.Build.0 = Debug|Any CPU\n\t\t{g}.Release|Any CPU.ActiveCfg = Release|Any CPU\n\t\t{g}.Release|Any CPU.Build.0 = Release|Any CPU\n'
          if lines: text=text.replace(marker,marker+lines,1)
          nested='\tGlobalSection(NestedProjects) = preSolution\n'
          if nested in text and '{B6E0C1B1-6A11-4EAA-9D18-ACF010000006} = {D02DA5C0-5F94-4BB1-87A0-60A5A8BB9E7A}' not in text: text=text.replace(nested,nested+'\t\t{B6E0C1B1-6A11-4EAA-9D18-ACF010000006} = {D02DA5C0-5F94-4BB1-87A0-60A5A8BB9E7A}\n',1)
          p.write_text(text,encoding='utf-8')

          p=Path('.github/workflows/ai-platform-validation.yml'); text=p.read_text(encoding='utf-8-sig')
          text=text.replace('branches:\n      - master\n  pull_request:\n    branches:\n      - master','branches:\n      - master\n      - feature/ai-platform-phase1-6-integration\n  pull_request:\n    branches:\n      - master\n      - feature/ai-platform-phase1-6-integration'); p.write_text(text,encoding='utf-8')
          p=Path('.github/workflows/ai-platform-sql-validation.yml'); text=p.read_text(encoding='utf-8-sig')
          text=text.replace('branches: [master, "feature/ai-platform-phase1-6"]','branches: [master, "feature/ai-platform-phase1-6", "feature/ai-platform-phase1-6-integration"]').replace('pull_request:\n    branches: [master]','pull_request:\n    branches: [master, "feature/ai-platform-phase1-6-integration"]'); p.write_text(text,encoding='utf-8')
          PY

      - name: Validate integration shape
        run: |
          set -euo pipefail
          test -f FVN_REGISTER.AI.Core/FVN_REGISTER.AI.Core.csproj
          test -f FVN_REGISTER.AI.Application/FVN_REGISTER.AI.Application.csproj
          test -f FVN_REGISTER.AI.Infrastructure/FVN_REGISTER.AI.Infrastructure.csproj
          test -f FVN_REGISTER.AI.Api/FVN_REGISTER.AI.Api.csproj
          test -f FVN_REGISTER.AI.Worker/FVN_REGISTER.AI.Worker.csproj
          test -f Tests/FVN_REGISTER.AI.Tests/FVN_REGISTER.AI.Tests.csproj
          test -f FVN_REGISTER.API/Controllers/AIHRCaseController.cs
          test -f FVN_REGISTER.Shared/Pages/AIHRCaseWorkspace.razor
          test -f SQL/AI/014_Phase5_ReleaseRetentionTenantHardening.sql
          grep -Fq 'FVN_REGISTER.AI.Application\\FVN_REGISTER.AI.Application.csproj' FVN_REGISTER.API/FVN_REGISTER.API.csproj
          grep -Fq 'FVN_REGISTER.AI.Application\\FVN_REGISTER.AI.Application.csproj' FVN_REGISTER.Shared/FVN_REGISTER.Shared.csproj
          grep -Fq 'AddHttpClient("FvnAi"' FVN_REGISTER.API/Program.cs
          grep -Fq '"AIPlatform"' FVN_REGISTER.API/appsettings.json
          grep -Fq 'FVN_REGISTER.AI.Core\\FVN_REGISTER.AI.Core.csproj' FVN_REGISTER.sln

      - name: Commit imported AI platform to integration branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): integrate AI Platform phase 1-6" || true
          git push origin HEAD:feature/ai-platform-phase1-6-integration
