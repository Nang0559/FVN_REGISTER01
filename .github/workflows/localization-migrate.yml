name: i18n Razor migration

on:
  push:
    branches:
      - feature/i18n-vi-ja
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply localization migration
        run: python3 ./scripts/apply-ui-localization.py

      - name: Build Shared project
        run: dotnet build FVN_REGISTER.Shared/FVN_REGISTER.Shared.csproj --no-restore

      - name: Commit generated localization changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Razor localization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FVN_REGISTER.Shared scripts
          git commit -m "feat(i18n): localize remaining Razor UI"
          git push
