name: Apply normal-shift symbol display patch

on:
  push:
    branches:
      - fix/hrm-holiday-symbol-sync
    paths:
      - '.github/patches/fix-normal-shift-symbol-display.patch'
      - '.github/workflows/apply-fix-normal-shift-symbol-display.yml'

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/hrm-holiday-symbol-sync
          fetch-depth: 0

      - name: Validate and apply patch
        run: |
          git apply --check .github/patches/fix-normal-shift-symbol-display.patch
          git apply .github/patches/fix-normal-shift-symbol-display.patch
          git diff --check
          git diff -- FVN_REGISTER.Infrastructure/Services/Calendar/AttendanceSymbolRuleService.cs FVN_REGISTER.Infrastructure/Services/HrmSync/HrmAttendanceCalculationService.cs

      - name: Commit patched source and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/patches/fix-normal-shift-symbol-display.patch .github/workflows/apply-fix-normal-shift-symbol-display.yml
          git add FVN_REGISTER.Infrastructure/Services/Calendar/AttendanceSymbolRuleService.cs FVN_REGISTER.Infrastructure/Services/HrmSync/apply-fix-normal-shift-symbol-display.yml .github/patches/fix-normal-shift-symbol-display.patch .github/workflows/apply-fix-normal-shift-symbol-display.yml 2>/dev/null || true
          git add FVN_REGISTER.Infrastructure/Services/Calendar/AttendanceSymbolRuleService.cs FVN_REGISTER.Infrastructure/Services/HrmSync/HrmAttendanceCalculationService.cs
          git diff --cached --check
          git commit -m "fix: allow normal shift attendance symbol refresh [skip ci]"
          git push origin HEAD:fix/hrm-holiday-symbol-sync
