name: Discover HRM Users and Roles

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to inspect
        required: true
        type: choice
        options:
          - develop
          - deploy
        default: develop

permissions:
  contents: read

concurrency:
  group: role-discovery-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: [self-hosted, Windows, X64]
    environment: ${{ inputs.target }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Discover current users, roles and grants
        shell: pwsh
        env:
          FVN_SQL_CONNECTION_STRING: ${{ secrets.FVN_SQL_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FVN_SQL_CONNECTION_STRING)) {
            throw "Missing FVN_SQL_CONNECTION_STRING in the selected GitHub environment."
          }
          ./test/role-discovery/Discover-UserRoles.ps1 -OutputDirectory ./artifacts/role-discovery
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-discovery-${{ inputs.target }}-${{ github.run_number }}
          path: artifacts/role-discovery/
          if-no-files-found: warn
          retention-days: 14
