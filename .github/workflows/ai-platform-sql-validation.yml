name: AI SQL Server integration validation

on:
  push:
    branches: ["feature/ai-platform-phase1-6-integration"]
    paths: ["SQL/AI/**", "FVN_REGISTER.AI.Infrastructure/Persistence/**", "FVN_REGISTER.AI.Infrastructure/Services/**", "FVN_REGISTER.AI.Application/**", "FVN_REGISTER.AI.Api/appsettings.json", "FVN_REGISTER.AI.Infrastructure/DependencyInjection.cs", "scripts/apply-ai-migrations.sh", "Tests/FVN_REGISTER.AI.Tests/**", ".github/workflows/ai-platform-sql-validation.yml"]
  pull_request:
    branches: ["feature/ai-platform-phase1-6-integration"]
    paths: ["SQL/AI/**", "FVN_REGISTER.AI.Infrastructure/Persistence/**", "FVN_REGISTER.AI.Infrastructure/Services/**", "FVN_REGISTER.AI.Application/**", "FVN_REGISTER.AI.Api/appsettings.json", "FVN_REGISTER.AI.Infrastructure/DependencyInjection.cs", "scripts/apply-ai-migrations.sh", "Tests/FVN_REGISTER.AI.Tests/**", ".github/workflows/ai-platform-sql-validation.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations-and-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Start SQL Server 2022
        env: { SA_PASSWORD: "FvnAi_CI_Strong!Pass2026" }
        run: |
          docker run -d --name fvn-ai-sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          ready=0; for i in $(seq 1 60); do if docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then ready=1; break; fi; sleep 5; done; test "$ready" -eq 1
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "IF DB_ID(N'FVN_AI') IS NULL CREATE DATABASE FVN_AI;"
      - name: Apply migrations 001-020 twice and verify checksums
        env: { SA_PASSWORD: "FvnAi_CI_Strong!Pass2026" }
        run: |
          set -euo pipefail; docker cp SQL/AI fvn-ai-sql:/tmp/SQLAI; docker cp scripts/apply-ai-migrations.sh fvn-ai-sql:/tmp/apply-ai-migrations.sh
          for pass in 1 2; do docker exec -e SQLCMD_PATH=/opt/mssql-tools18/bin/sqlcmd -e SQLCMD_SERVER=localhost -e SQLCMD_DATABASE=FVN_AI -e SQLCMD_USER=sa -e SQLCMD_PASSWORD="$SA_PASSWORD" -e MIGRATIONS_DIR=/tmp/SQLAI fvn-ai-sql bash /tmp/apply-ai-migrations.sh; done
      - name: Verify constraints and checksum ledger
        env: { SA_PASSWORD: "FvnAi_CI_Strong!Pass2026" }
        run: |
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -Q "IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE object_id=OBJECT_ID(N'ai.AiModelReleases') AND name=N'UX_AiModelReleases_OneActive' AND is_unique=1 AND has_filter=1) THROW 52001,'One-active filtered unique index is missing.',1; IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE object_id=OBJECT_ID(N'ai.AiExtractions') AND name=N'UX_AiExtractions_Document_Schema_Model' AND is_unique=1 AND has_filter=1) THROW 52002,'Release-aware extraction uniqueness index is missing.',1; IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE object_id=OBJECT_ID(N'ai.AiExtractions') AND name=N'UX_AiExtractions_Document_Unversioned_Model' AND is_unique=1 AND has_filter=1) THROW 52003,'Unversioned extraction uniqueness guard is missing.',1; IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE object_id=OBJECT_ID(N'ai.AiKnowledgeChunks') AND name=N'UX_AiKnowledgeChunks_Tenant_Document_Ordinal' AND is_unique=1) THROW 52004,'Knowledge chunk ordinal index is missing.',1; IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE object_id=OBJECT_ID(N'ai.AiDocuments') AND name=N'UX_AiDocuments_Tenant_Fingerprint_Active' AND is_unique=1 AND has_filter=1) THROW 52005,'Active document fingerprint index is missing.',1; IF COL_LENGTH(N'ai.AiValidationIssues',N'TenantCode') IS NULL OR COL_LENGTH(N'ai.AiGoldenDatasetEvaluations',N'TenantCode') IS NULL THROW 52006,'Tenant columns are missing.',1; IF COL_LENGTH(N'ai.AiExtractions',N'ReleaseId') IS NULL OR COL_LENGTH(N'ai.AiFeedback',N'ReleaseId') IS NULL THROW 52007,'Release provenance columns are missing.',1; IF NOT EXISTS (SELECT 1 FROM sys.triggers WHERE name=N'trg_AiRequestNonces_MinReplayWindow') THROW 52008,'Ten-minute nonce replay guard is missing.',1; IF OBJECT_ID(N'ai.AiDataEntryTemplates',N'U') IS NULL OR OBJECT_ID(N'ai.AiDataEntryRuns',N'U') IS NULL THROW 52014,'Migration 015 data-entry tables are missing.',1; IF OBJECT_ID(N'ai.AiConversations',N'U') IS NULL OR OBJECT_ID(N'ai.AiConversationMessages',N'U') IS NULL OR OBJECT_ID(N'ai.usp_PurgeExpiredConversations',N'P') IS NULL THROW 52015,'Migration 016 conversation objects are missing.',1; IF NOT EXISTS(SELECT 1 FROM sys.foreign_keys WHERE name=N'FK_AiConversationMessages_ConversationOwner' AND is_disabled=0) THROW 52016,'Conversation tenant/actor composite FK is missing.',1; IF NOT EXISTS(SELECT 1 FROM ai.AiSchemaMigrations WHERE MigrationId=N'015_DocumentDataEntry' AND Sha256Checksum IS NOT NULL) OR NOT EXISTS(SELECT 1 FROM ai.AiSchemaMigrations WHERE MigrationId=N'016_ConversationPersistence' AND Sha256Checksum IS NOT NULL) THROW 52017,'Migration 015/016 checksums are missing.',1; IF OBJECT_ID(N'ai.trg_AiIngestionJobs_DeadLetterDocumentStatus',N'TR') IS NOT NULL THROW 52018,'Unexpected queue trigger remains.',1; IF OBJECT_DEFINITION(OBJECT_ID(N'ai.usp_FailAiIngestionJob')) NOT LIKE N'%AiDocuments%' THROW 52019,'Failure procedure does not update document state.',1; IF NOT EXISTS(SELECT 1 FROM ai.AiSchemaMigrations WHERE MigrationId=N'017_DeadLetterDocumentStatus' AND Sha256Checksum IS NOT NULL) OR NOT EXISTS(SELECT 1 FROM ai.AiSchemaMigrations WHERE MigrationId=N'019_DeadLetterProcedureAndTriggerCompatibility' AND Sha256Checksum IS NOT NULL) THROW 52021,'Migration 017/019 checksums are missing.',1; IF OBJECT_ID(N'ai.usp_RecoverStaleConversationTurns',N'P') IS NULL OR NOT EXISTS(SELECT 1 FROM ai.AiSchemaMigrations WHERE MigrationId=N'018_ConversationPendingRecovery' AND Sha256Checksum IS NOT NULL) THROW 52020,'Migration 018 stale-turn recovery procedure/checksum is missing.',1; IF OBJECT_ID(N'ai.usp_ClaimAiIngestionJob',N'P') IS NULL OR OBJECT_DEFINITION(OBJECT_ID(N'ai.usp_ClaimAiIngestionJob')) NOT LIKE N'%sp_getapplock%' OR NOT EXISTS(SELECT 1 FROM ai.AiSchemaMigrations WHERE MigrationId=N'020_AtomicSerializedQueueClaims' AND Sha256Checksum IS NOT NULL) THROW 52022,'Migration 020 serialized queue claim procedure/checksum is missing.',1; IF NOT EXISTS (SELECT 1 FROM ai.AiSchemaMigrations WHERE MigrationId=N'014_Phase5_ReleaseRetentionTenantHardening' AND MigrationFileName=N'014_Phase5_ReleaseRetentionTenantHardening.sql' AND Sha256Checksum IS NOT NULL) THROW 52012,'Migration 014 checksum is missing.',1; IF EXISTS (SELECT 1 FROM sys.foreign_keys WHERE name IN(N'FK_AiValidationIssues_TenantExtraction',N'FK_AiGoldenDatasetEvaluations_TenantCase',N'FK_AiGoldenDatasetEvaluations_TenantRelease',N'FK_AiExtractions_TenantRelease',N'FK_AiFeedback_TenantRelease') AND is_disabled=1) THROW 52013,'A tenant composite FK is disabled.',1;"
      - name: Verify duplicate ordinal migration failure on legacy data
        env: { SA_PASSWORD: "FvnAi_CI_Strong!Pass2026" }
        run: |
          set -euo pipefail; docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "IF DB_ID(N'FVN_AI_DUPLICATE_TEST') IS NULL CREATE DATABASE FVN_AI_DUPLICATE_TEST;"
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI_DUPLICATE_TEST -Q "IF SCHEMA_ID(N'ai') IS NULL EXEC(N'CREATE SCHEMA ai'); CREATE TABLE ai.AiKnowledgeChunks(TenantCode nvarchar(64) NOT NULL,DocumentId uniqueidentifier NOT NULL,ChunkOrdinal int NOT NULL); INSERT ai.AiKnowledgeChunks VALUES(N'ci','11111111-1111-1111-1111-111111111111',0),(N'ci','11111111-1111-1111-1111-111111111111',0); CREATE TABLE ai.AiSchemaMigrations(MigrationId nvarchar(160) NOT NULL PRIMARY KEY,AppliedAtUtc datetimeoffset(7) NOT NULL DEFAULT SYSUTCDATETIME());"
          docker cp SQL/AI/012_KnowledgeChunkConstraint_And_ChecksumLedger.sql fvn-ai-sql:/tmp/migration012.sql; set +e; docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI_DUPLICATE_TEST -i /tmp/migration012.sql > /tmp/duplicate-migration.log 2>&1; code=$?; set -e; if [ "$code" -eq 0 ] || ! grep -q "Duplicate knowledge chunk ordinals exist" /tmp/duplicate-migration.log; then cat /tmp/duplicate-migration.log; exit 1; fi
      - name: Concurrent SQL lease claims, nonce replay and dead-letter document status
        env: { SA_PASSWORD: "FvnAi_CI_Strong!Pass2026" }
        run: |
          set -euo pipefail
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -Q "SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON; DECLARE @i int=1,@doc uniqueidentifier,@sha nvarchar(64); WHILE @i<=12 BEGIN SET @doc=NEWID(); SET @sha=RIGHT(REPLICATE('0',64)+CONVERT(varchar(8),@i),64); INSERT ai.AiDocuments(Id,TenantCode,FileName,Extension,MediaType,Length,Sha256,StorageKey,UploadedBy,ReceivedAtUtc,Status,ModuleCode,SchemaCode,SourceType,SourceReference) VALUES(@doc,N'ci-queue',CONCAT(N'ci-',@i,N'.txt'),N'.txt',N'text/plain',1,@sha,CONCAT(N'ci/',@i),N'ci-worker',TODATETIMEOFFSET(SYSUTCDATETIME(),'+00:00'),N'ReadyForProcessing',N'ci',N'v1',N'Upload',N'ci-test'); INSERT ai.AiIngestionJobs(Id,DocumentId,Status,AttemptCount,CreatedAtUtc) VALUES(NEWID(),@doc,N'Queued',0,TODATETIMEOFFSET(SYSUTCDATETIME(),'+00:00')); SET @i+=1; END;"
          claim_pids=(); for i in $(seq 1 12); do (docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -h -1 -W -Q "SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON; SET NOCOUNT ON; DECLARE @claimed table(JobId uniqueidentifier,DocumentId uniqueidentifier,AttemptCount int,LeaseOwner nvarchar(128),LeaseUntilUtc datetimeoffset(7)); INSERT @claimed EXEC ai.usp_ClaimAiIngestionJob @WorkerId=N'ci-worker-$i',@LeaseSeconds=60; SELECT CONVERT(varchar(36),JobId) FROM @claimed;" > "/tmp/claim-$i.txt" 2>&1) & claim_pids+=($!); done
          claim_failed=0; for pid in "${claim_pids[@]}"; do wait "$pid" || claim_failed=1; done
          echo "Concurrent claim command failures: $claim_failed"; for file in /tmp/claim-*.txt; do echo "--- $file"; cat "$file"; done
          claimed=$(grep -Eio '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/claim-*.txt | sort -u | wc -l | tr -d ' '); echo "Distinct jobs claimed: $claimed"; test "$claim_failed" -eq 0; test "$claimed" -eq 12
          nonce_pids=(); for i in $(seq 1 12); do (docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -h -1 -W -Q "SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON; SET NOCOUNT ON; BEGIN TRY INSERT ai.AiRequestNonces(TenantCode,Nonce,ExpiresAtUtc) VALUES(N'ci-tenant',N'concurrent-replay-test',DATEADD(minute,5,TODATETIMEOFFSET(SYSUTCDATETIME(),'+00:00'))); SELECT N'ACCEPTED'; END TRY BEGIN CATCH IF ERROR_NUMBER() IN(2601,2627) SELECT N'REPLAY'; ELSE THROW; END CATCH;" > "/tmp/nonce-$i.txt" 2>&1) & nonce_pids+=($!); done
          nonce_failed=0; for pid in "${nonce_pids[@]}"; do wait "$pid" || nonce_failed=1; done
          echo "Nonce command failures: $nonce_failed"; for file in /tmp/nonce-*.txt; do echo "--- $file"; cat "$file"; done
          accepted=$(grep -h -c 'ACCEPTED' /tmp/nonce-*.txt | awk -F: '{s+=$NF} END{print s+0}'); replay=$(grep -h -c 'REPLAY' /tmp/nonce-*.txt | awk -F: '{s+=$NF} END{print s+0}'); echo "Nonce results: accepted=$accepted replay=$replay"; test "$nonce_failed" -eq 0; test "$accepted" -eq 1; test "$replay" -eq 11
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -Q "SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON; DECLARE @job uniqueidentifier=(SELECT TOP 1 Id FROM ai.AiIngestionJobs WHERE Status=N'Running'); IF @job IS NULL THROW 52030,'No running job available.',1; DECLARE @worker nvarchar(128)=(SELECT LeaseOwner FROM ai.AiIngestionJobs WHERE Id=@job); SELECT @job AS JobId,@worker AS LeaseOwner; UPDATE ai.AiIngestionJobs SET AttemptCount=MaxAttempts WHERE Id=@job; EXEC ai.usp_FailAiIngestionJob @JobId=@job,@WorkerId=@worker,@FailureCode=N'CI_DEADLETTER',@Retryable=1; SELECT j.Id,j.Status,j.AttemptCount,j.MaxAttempts,d.Status AS DocumentStatus FROM ai.AiIngestionJobs j JOIN ai.AiDocuments d ON d.Id=j.DocumentId WHERE j.Id=@job; IF NOT EXISTS(SELECT 1 FROM ai.AiDocuments d JOIN ai.AiIngestionJobs j ON j.DocumentId=d.Id WHERE j.Id=@job AND j.Status=N'DeadLetter' AND d.Status=N'Failed') THROW 52031,'DeadLetter did not propagate to document status.',1;"
      - name: Verify conversation recovery and expiry maintenance procedures
        env: { SA_PASSWORD: "FvnAi_CI_Strong!Pass2026" }
        run: |
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -Q "SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON; DECLARE @now datetimeoffset(7)=TODATETIMEOFFSET(SYSUTCDATETIME(),'+00:00'),@stale uniqueidentifier=NEWID(),@expired uniqueidentifier=NEWID(); INSERT ai.AiConversations(Id,TenantCode,ActorId,Title,Status,CreatedAtUtc,UpdatedAtUtc,ExpiresAtUtc) VALUES(@stale,N'ci-maintenance',N'ci-worker',N'Stale recovery test',N'Active',DATEADD(hour,-1,@now),DATEADD(hour,-1,@now),DATEADD(day,1,@now)); INSERT ai.AiConversationMessages(Id,ConversationId,TenantCode,ActorId,Sequence,Role,Content,Status,CreatedAtUtc) VALUES(NEWID(),@stale,N'ci-maintenance',N'ci-worker',1,N'user',N'stale pending turn',N'Pending',DATEADD(minute,-30,@now)); EXEC ai.usp_RecoverStaleConversationTurns @StaleMinutes=15,@BatchSize=10; IF NOT EXISTS(SELECT 1 FROM ai.AiConversationMessages WHERE ConversationId=@stale AND Status=N'Failed') THROW 52040,'Stale conversation turn was not recovered.',1; INSERT ai.AiConversations(Id,TenantCode,ActorId,Title,Status,CreatedAtUtc,UpdatedAtUtc,ExpiresAtUtc) VALUES(@expired,N'ci-maintenance',N'ci-worker',N'Expired purge test',N'Active',DATEADD(day,-2,@now),DATEADD(day,-2,@now),DATEADD(day,-1,@now)); EXEC ai.usp_PurgeExpiredConversations @BatchSize=10; IF EXISTS(SELECT 1 FROM ai.AiConversations WHERE Id=@expired) THROW 52041,'Expired conversation was not purged.',1;"
      - name: Guard tenant filters in RAG retrieval and tenant references in SQL procedures
        env: { SA_PASSWORD: "FvnAi_CI_Strong!Pass2026" }
        run: |
          set -euo pipefail; grep -Fq 'k.TenantCode = {tenantCode}' FVN_REGISTER.AI.Infrastructure/Services/SqlVectorKnowledgeStore.cs; grep -Fq 'r.TenantCode = {tenantCode} AND r.DocumentId = k.DocumentId' FVN_REGISTER.AI.Infrastructure/Services/SqlVectorKnowledgeStore.cs
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -Q "SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON; IF EXISTS(SELECT 1 FROM sys.procedures p JOIN sys.schemas s ON s.schema_id=p.schema_id JOIN sys.sql_modules m ON m.object_id=p.object_id WHERE s.name=N'ai' AND (m.definition LIKE N'%AiDocuments%' OR m.definition LIKE N'%AiExtractions%' OR m.definition LIKE N'%AiReviews%' OR m.definition LIKE N'%AiKnowledgeChunks%' OR m.definition LIKE N'%AiFeedback%' OR m.definition LIKE N'%AiHRCases%') AND m.definition NOT LIKE N'%TenantCode%' AND p.name NOT IN(N'usp_ClaimAiIngestionJob',N'usp_RecoverExpiredAiIngestionLeases',N'usp_RenewAiIngestionLease',N'usp_CompleteAiIngestionJob',N'usp_FailAiIngestionJob')) THROW 52020,'Tenant-sensitive AI stored procedure does not reference TenantCode.',1;"
      - name: Tenant-scoped duplicate-key smoke test
        env: { SA_PASSWORD: "FvnAi_CI_Strong!Pass2026" }
        run: |
          docker exec fvn-ai-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d FVN_AI -Q "SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON; DECLARE @sha nvarchar(64)=REPLICATE(N'A',64); INSERT ai.AiDocuments(Id,TenantCode,FileName,Extension,MediaType,Length,Sha256,StorageKey,UploadedBy,ReceivedAtUtc,Status,ModuleCode,SchemaCode,SourceType,SourceReference) VALUES(NEWID(),N'ci-tenant-A',N'a.txt',N'.txt',N'text/plain',1,@sha,N'ci/tenantA',N'ci',TODATETIMEOFFSET(SYSUTCDATETIME(),'+00:00'),N'ReadyForProcessing',N'ci',N'v1',N'Upload',N'ci-tenant-test'),(NEWID(),N'ci-tenant-B',N'b.txt',N'.txt',N'text/plain',1,@sha,N'ci/tenantB',N'ci',TODATETIMEOFFSET(SYSUTCDATETIME(),'+00:00'),N'ReadyForProcessing',N'ci',N'v1',N'Upload',N'ci-tenant-test'); IF(SELECT COUNT(*) FROM ai.AiDocuments WHERE TenantCode IN(N'ci-tenant-A',N'ci-tenant-B') AND Sha256=@sha)<>2 THROW 52040,'Tenant-scoped deduplication crossed tenant boundaries.',1;"
      - name: Run AI unit tests including Phase 5 hardening cases
        run: dotnet test Tests/FVN_REGISTER.AI.Tests/FVN_REGISTER.AI.Tests.csproj --configuration Release
