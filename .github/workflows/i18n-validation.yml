name: i18n-validation

on:
  push:
    branches:
      - feature/i18n-vi-ja-cleanup
  pull_request:
    branches:
      - feature/i18n-vi-ja-cleanup

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate localization
        run: python3 scripts/validate-ui-localization.py
