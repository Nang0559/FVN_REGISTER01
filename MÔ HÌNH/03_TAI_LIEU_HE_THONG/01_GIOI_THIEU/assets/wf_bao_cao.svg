<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Aptos, 'Segoe UI', 'Yu Gothic UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Luồng công việc và báo cáo trước và sau</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="30" font-size="14" font-weight="600" fill="#444441">Trước · hỏi và ghép bảng</text><rect x="40" y="42" width="170" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="125.0" y="60" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">Hỏi từng bộ phận</text><text x="125.0" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">nhắc qua tin nhắn</text><rect x="255" y="42" width="170" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="60" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">Ghép nhiều bảng</text><text x="340.0" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">cuối kỳ</text><rect x="470" y="42" width="170" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="555.0" y="60" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">Chờ số liệu</text><text x="555.0" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">mới quyết định</text><line x1="213" y1="70" x2="250" y2="70" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="428" y1="70" x2="465" y2="70" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><text x="40" y="122" font-size="12" fill="#5F5E5A">Điểm nghẽn: số liệu đến muộn, mỗi bộ phận một cách ghi</text><text x="40" y="170" font-size="14" font-weight="600" fill="#085041">Sau · FVN REGISTER</text><rect x="40" y="182" width="170" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="125.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">Việc cần xử lý</text><text x="125.0" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">thông báo từng người</text><rect x="255" y="182" width="170" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">Báo cáo theo quyền</text><text x="340.0" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">bảng điều khiển</text><rect x="470" y="182" width="170" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="555.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">Quyết định</text><text x="555.0" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">dựa trên dữ liệu</text><line x1="213" y1="210" x2="250" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="428" y1="210" x2="465" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><text x="40" y="262" font-size="12" fill="#0F6E56">Giải quyết: tồn đọng và tiến độ thấy ngay, trong phạm vi quyền được cấp</text></svg>