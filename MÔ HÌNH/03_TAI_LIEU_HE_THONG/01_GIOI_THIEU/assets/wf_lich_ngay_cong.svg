<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Aptos, 'Segoe UI', 'Yu Gothic UI', Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Luồng lịch và ngày công trước và sau</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="30" font-size="14" font-weight="600" fill="#444441">Trước · hỏi HR, giải trình giấy</text><rect x="40" y="42" width="100" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="90.0" y="60" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">Hỏi HR</text><text x="90.0" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">ca, ngày công</text><rect x="165" y="42" width="100" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="215.0" y="60" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">Chờ cuối kỳ</text><text x="215.0" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">HR mới rà</text><rect x="290" y="42" width="100" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="60" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">Viết giải</text><text x="340.0" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">trình giấy</text><rect x="415" y="42" width="100" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="465.0" y="60" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">HR tra</text><text x="465.0" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">máy chấm công</text><rect x="540" y="42" width="100" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="590.0" y="60" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">Hỏi lại</text><text x="590.0" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">kết quả</text><line x1="143" y1="70" x2="160" y2="70" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="268" y1="70" x2="285" y2="70" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="393" y1="70" x2="410" y2="70" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="518" y1="70" x2="535" y2="70" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><text x="40" y="122" font-size="12" fill="#5F5E5A">Điểm nghẽn: biết lỗi muộn, giải trình dồn cuối kỳ, hỏi lặp lại</text><text x="40" y="170" font-size="14" font-weight="600" fill="#085041">Sau · FVN REGISTER</text><rect x="40" y="182" width="100" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="90.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">Xem lịch</text><text x="90.0" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">cá nhân</text><rect x="165" y="182" width="100" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="215.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">Đánh dấu</text><text x="215.0" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">ngày lệch</text><rect x="290" y="182" width="100" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">Phản hồi</text><text x="340.0" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">tại ngày đó</text><rect x="415" y="182" width="100" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="465.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">HR xem xét</text><text x="465.0" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">kèm ghi chú</text><rect x="540" y="182" width="100" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="590.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">Xem kết quả</text><text x="590.0" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">trên lịch</text><line x1="143" y1="210" x2="160" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="268" y1="210" x2="285" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="393" y1="210" x2="410" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="518" y1="210" x2="535" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><text x="40" y="262" font-size="12" fill="#0F6E56">Giải quyết: thấy lỗi sớm, giải trình tại chỗ; HRM vẫn là nguồn tính công</text></svg>